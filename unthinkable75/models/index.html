<title>Unthinkable Motor Pool</title>
<style>/* Layout: full-bleed 3D stage; top name plate; bottom drawer with fleet list + action row */
:root{--bg:#0e1216;--panel:#151b21;--panel2:#1c242c;--line:#2a343e;--fg:#e9eef2;--mute:#8fa0ad;--acc:#f0a63a;--nato:#5aa0e6;--pact:#e5604d;--r:10px;--ui:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;--body:'Barlow',system-ui,sans-serif}
:root{color-scheme:dark}
*{box-sizing:border-box}

#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#top{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);padding:10px max(16px,env(safe-area-inset-left,0px)) 0;pointer-events:none;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
#plate{max-width:calc(100% - 200px);background:rgba(14,18,22,.72);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:var(--r);padding:8px 12px;min-width:0;pointer-events:auto}
#plate h1{margin:0;font:700 18px/1.05 var(--ui);letter-spacing:.02em;text-transform:uppercase;overflow-wrap:anywhere}
#plate .meta{display:flex;gap:8px;align-items:center;margin-top:4px;font:600 12px var(--ui);letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.chip{display:inline-block;padding:1px 7px;border-radius:4px;font:700 11px var(--ui);letter-spacing:.1em;color:#0e1216}
.chip.NATO{background:var(--nato)}.chip.PACT{background:var(--pact)}
#tools{display:flex;gap:6px;pointer-events:auto}
.ib{min-width:38px;height:38px;padding:0 10px;border-radius:var(--r);border:1px solid var(--line);background:rgba(14,18,22,.72);backdrop-filter:blur(8px);color:var(--fg);font:700 13px var(--ui);letter-spacing:.06em;text-transform:uppercase;cursor:pointer}

@media(max-width:899px){#cv{height:56%}body.dmin #cv{height:100%}}

@media(min-width:900px){#drawer{left:auto;right:12px;bottom:12px;width:420px;height:auto;max-height:calc(100% - 100px);border-radius:16px;border:1px solid var(--line)}#drawer.min{transform:none}#hint{bottom:14px}}

<script>/* ---- a_build.js ---- */
'use strict';
/* ===== math ===== */
const D2R = Math.PI / 180;
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const V3 = {
  add: (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]],
  sub: (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]],
  mul: (a, s) => [a[0] * s, a[1] * s, a[2] * s],
  dot: (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2],
  cross: (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]],
  len: a => Math.hypot(a[0], a[1], a[2]),
  norm: a => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; },
  lerp: (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t],
};
const M4 = {
  id() { const m = new Float32Array(16); m[0] = m[5] = m[10] = m[15] = 1; return m; },
  mul(a, b) {
    const o = new Float32Array(16);
    for (let c = 0; c < 4; c++) for (let r = 0; r < 4; r++)
      o[c * 4 + r] = a[r] * b[c * 4] + a[4 + r] * b[c * 4 + 1] + a[8 + r] * b[c * 4 + 2] + a[12 + r] * b[c * 4 + 3];
    return o;
  },
  T(x, y, z) { const m = M4.id(); m[12] = x; m[13] = y; m[14] = z; return m; },
  S(x, y, z) { const m = M4.id(); m[0] = x; m[5] = y; m[10] = z; return m; },
  Rx(d) { const c = Math.cos(d * D2R), s = Math.sin(d * D2R), m = M4.id(); m[5] = c; m[6] = s; m[9] = -s; m[10] = c; return m; },
  Ry(d) { const c = Math.cos(d * D2R), s = Math.sin(d * D2R), m = M4.id(); m[0] = c; m[2] = -s; m[8] = s; m[10] = c; return m; },
  Rz(d) { const c = Math.cos(d * D2R), s = Math.sin(d * D2R), m = M4.id(); m[0] = c; m[1] = s; m[4] = -s; m[5] = c; return m; },
  /* euler: pitch(x) yaw(y) roll(z) -> Ry*Rx*Rz */
  R(p, y, r) { let m = M4.Ry(y || 0); if (p) m = M4.mul(m, M4.Rx(p)); if (r) m = M4.mul(m, M4.Rz(r)); return m; },
  persp(fovy, asp, n, f) {
    const t = 1 / Math.tan(fovy * D2R / 2), m = new Float32Array(16);
    m[0] = t / asp; m[5] = t; m[10] = (f + n) / (n - f); m[11] = -1; m[14] = 2 * f * n / (n - f); return m;
  },
  lookAt(e, t, u) {
    const z = V3.norm(V3.sub(e, t)), x = V3.norm(V3.cross(u, z)), y = V3.cross(z, x), m = new Float32Array(16);
    m[0] = x[0]; m[4] = x[1]; m[8] = x[2]; m[12] = -V3.dot(x, e);
    m[1] = y[0]; m[5] = y[1]; m[9] = y[2]; m[13] = -V3.dot(y, e);
    m[2] = z[0]; m[6] = z[1]; m[10] = z[2]; m[14] = -V3.dot(z, e); m[15] = 1; return m;
  },
  /* model matrix looking along dir (z axis = dir) at pos */
  along(pos, dir, up) {
    const z = V3.norm(dir); up = up || [0, 1, 0];
    let x = V3.cross(up, z); if (V3.len(x) < 1e-4) x = V3.cross([1, 0, 0], z); x = V3.norm(x);
    const y = V3.cross(z, x), m = new Float32Array(16);
    m[0] = x[0]; m[1] = x[1]; m[2] = x[2]; m[4] = y[0]; m[5] = y[1]; m[6] = y[2];
    m[8] = z[0]; m[9] = z[1]; m[10] = z[2]; m[12] = pos[0]; m[13] = pos[1]; m[14] = pos[2]; m[15] = 1; return m;
  },
  xp(m, p) { return [m[0] * p[0] + m[4] * p[1] + m[8] * p[2] + m[12], m[1] * p[0] + m[5] * p[1] + m[9] * p[2] + m[13], m[2] * p[0] + m[6] * p[1] + m[10] * p[2] + m[14]]; },
  xd(m, d) { return [m[0] * d[0] + m[4] * d[1] + m[8] * d[2], m[1] * d[0] + m[5] * d[1] + m[9] * d[2], m[2] * d[0] + m[6] * d[1] + m[10] * d[2]]; },
  /* inverse transpose of upper 3x3 (normal matrix) as 9 array column-major */
  nrm(m) {
    const a = m[0], b = m[1], c = m[2], d = m[4], e = m[5], f = m[6], g = m[8], h = m[9], i = m[10];
    const A = e * i - f * h, B = -(d * i - f * g), C = d * h - e * g;
    const det = a * A + b * B + c * C || 1e-9, id = 1 / det;
    // inverse = adj/det ; transpose of inverse -> cofactor/det
    return [A * id, B * id, C * id,
      -(b * i - c * h) * id, (a * i - c * g) * id, -(a * h - b * g) * id,
      (b * f - c * e) * id, -(a * f - c * d) * id, (a * e - b * d) * id];
  },
  det3(m) { return m[0] * (m[5] * m[10] - m[6] * m[9]) - m[4] * (m[1] * m[10] - m[2] * m[9]) + m[8] * (m[1] * m[6] - m[2] * m[5]); },
};

/* ===== colours (hex -> linear rgb) ===== */
function rgb(c) {
  if (Array.isArray(c)) return c;
  if (typeof c === 'string') c = parseInt(c.replace('#', ''), 16);
  const r = ((c >> 16) & 255) / 255, g = ((c >> 8) & 255) / 255, b = (c & 255) / 255;
  return [Math.pow(r, 2.2), Math.pow(g, 2.2), Math.pow(b, 2.2)];
}
function shade(c, f) { c = rgb(c); return [c[0] * f, c[1] * f, c[2] * f]; }
function mix(a, b, t) { a = rgb(a); b = rgb(b); return [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)]; }

/* ===== polygon triangulation (ear clipping) ===== */
function triangulate(pts) {
  const n = pts.length; if (n < 3) return [];
  let area = 0; for (let i = 0; i < n; i++) { const a = pts[i], b = pts[(i + 1) % n]; area += a[0] * b[1] - b[0] * a[1]; }
  const idx = []; for (let i = 0; i < n; i++) idx.push(i); if (area < 0) idx.reverse();
  const out = [];
  const cr = (a, b, c) => (b[0] - a[0]) * (c[1] - a[1]) - (b[1] - a[1]) * (c[0] - a[0]);
  const inT = (p, a, b, c) => cr(a, b, p) >= -1e-12 && cr(b, c, p) >= -1e-12 && cr(c, a, p) >= -1e-12;
  let guard = 0;
  while (idx.length > 3 && guard++ < 5000) {
    let ear = false;
    for (let i = 0; i < idx.length; i++) {
      const i0 = idx[(i + idx.length - 1) % idx.length], i1 = idx[i], i2 = idx[(i + 1) % idx.length];
      const a = pts[i0], b = pts[i1], c = pts[i2];
      if (cr(a, b, c) <= 1e-12) continue;
      let ok = true;
      for (let k = 0; k < idx.length; k++) { const j = idx[k]; if (j === i0 || j === i1 || j === i2) continue; if (inT(pts[j], a, b, c)) { ok = false; break; } }
      if (ok) { out.push([i0, i1, i2]); idx.splice(i, 1); ear = true; break; }
    }
    if (!ear) break;
  }
  if (idx.length === 3) out.push([idx[0], idx[1], idx[2]]);
  else for (let i = 1; i < idx.length - 1; i++) out.push([idx[0], idx[i], idx[i + 1]]);
  return out;
}

/* ===== geometry store ===== */
class Geo {
  constructor() { this.P = []; this.N = []; this.C = []; this.Mt = []; this.I = []; this.n = 0; this.buf = null; }
  vert(p, n, c, m) { this.P.push(p[0], p[1], p[2]); this.N.push(n[0], n[1], n[2]); this.C.push(c[0], c[1], c[2]); this.Mt.push(m); return this.n++; }
  tri(a, b, c) { this.I.push(a, b, c); }
  bake() {
    const P = this.P, N = this.N, I = this.I, n = this.n;
    // winding fix against vertex normals
    for (let t = 0; t < I.length; t += 3) {
      const a = I[t] * 3, b = I[t + 1] * 3, c = I[t + 2] * 3;
      const ux = P[b] - P[a], uy = P[b + 1] - P[a + 1], uz = P[b + 2] - P[a + 2];
      const vx = P[c] - P[a], vy = P[c + 1] - P[a + 1], vz = P[c + 2] - P[a + 2];
      const gx = uy * vz - uz * vy, gy = uz * vx - ux * vz, gz = ux * vy - uy * vx;
      const nx = N[a] + N[b] + N[c], ny = N[a + 1] + N[b + 1] + N[c + 1], nz = N[a + 2] + N[b + 2] + N[c + 2];
      if (gx * nx + gy * ny + gz * nz < 0) { const k = I[t + 1]; I[t + 1] = I[t + 2]; I[t + 2] = k; }
    }
    // outline normals: weld by position
    const on = new Float32Array(n * 3), map = new Map();
    for (let i = 0; i < n; i++) {
      const k = Math.round(P[i * 3] * 400) + ',' + Math.round(P[i * 3 + 1] * 400) + ',' + Math.round(P[i * 3 + 2] * 400);
      let e = map.get(k); if (!e) { e = [0, 0, 0]; map.set(k, e); }
      e[0] += N[i * 3]; e[1] += N[i * 3 + 1]; e[2] += N[i * 3 + 2];
    }
    for (let i = 0; i < n; i++) {
      const k = Math.round(P[i * 3] * 400) + ',' + Math.round(P[i * 3 + 1] * 400) + ',' + Math.round(P[i * 3 + 2] * 400);
      const e = map.get(k), l = Math.hypot(e[0], e[1], e[2]) || 1;
      on[i * 3] = e[0] / l; on[i * 3 + 1] = e[1] / l; on[i * 3 + 2] = e[2] / l;
    }
    const V = new Float32Array(n * 13);
    for (let i = 0; i < n; i++) {
      const o = i * 13;
      V[o] = P[i * 3]; V[o + 1] = P[i * 3 + 1]; V[o + 2] = P[i * 3 + 2];
      V[o + 3] = N[i * 3]; V[o + 4] = N[i * 3 + 1]; V[o + 5] = N[i * 3 + 2];
      V[o + 6] = this.C[i * 3]; V[o + 7] = this.C[i * 3 + 1]; V[o + 8] = this.C[i * 3 + 2];
      V[o + 9] = this.Mt[i];
      V[o + 10] = on[i * 3]; V[o + 11] = on[i * 3 + 1]; V[o + 12] = on[i * 3 + 2];
    }
    this.V = V; this.Idx = new Uint32Array(I); this.baked = true;
    this.P = this.N = this.C = this.Mt = this.I = null;
  }
}

/* ===== Part: a node with geometry + runtime pose ===== */
class Part {
  constructor(model, name, parent, pivot) {
    this.model = model; this.name = name; this.parent = parent || null; this.pivot = pivot || [0, 0, 0];
    this.geo = new Geo(); this.children = [];
    this.rot = [0, 0, 0]; this.off = [0, 0, 0]; this.sc = [1, 1, 1]; this.vis = true; this.world = M4.id();
    this.stack = [M4.id()]; this.cc = rgb(0x808080); this.cm = 0; this.outline = true;
    if (parent) parent.children.push(this);
  }
  /* ---- state ---- */
  col(c, m) { this.cc = rgb(c); if (m !== undefined) this.cm = m; return this; }
  mat(m) { this.cm = m; return this; }
  push() { this.stack.push(this.stack[this.stack.length - 1]); return this; }
  pop() { this.stack.pop(); return this; }
  tr(x, y, z) { this._top(M4.T(x, y, z)); return this; }
  ro(x, y, z) { let m = M4.id(); if (y) m = M4.mul(m, M4.Ry(y)); if (x) m = M4.mul(m, M4.Rx(x)); if (z) m = M4.mul(m, M4.Rz(z)); this._top(m); return this; }
  sca(x, y, z) { this._top(M4.S(x, y === undefined ? x : y, z === undefined ? x : z)); return this; }
  _top(m) { const s = this.stack; s[s.length - 1] = M4.mul(s[s.length - 1], m); }
  mir(fn) { fn(); this.push(); this.sca(-1, 1, 1); fn(); this.pop(); return this; }
  /* ---- emit ---- */
  _M(o) {
    let m = this.stack[this.stack.length - 1];
    if (o) {
      if (o.t) m = M4.mul(m, M4.T(o.t[0], o.t[1], o.t[2]));
      if (o.r) { const r = o.r; m = M4.mul(m, M4.mul(M4.Ry(r[1] || 0), M4.mul(M4.Rx(r[0] || 0), M4.Rz(r[2] || 0)))); }
      if (o.s) m = M4.mul(m, M4.S(o.s[0], o.s[1], o.s[2]));
    }
    return m;
  }
  _emit(P, N, I, o, extraM) {
    o = o || {};
    let m = this._M(o); if (extraM) m = M4.mul(m, extraM);
    const nm = M4.nrm(m), g = this.geo, c = o.c !== undefined ? rgb(o.c) : this.cc, mt = o.m !== undefined ? o.m : this.cm;
    const base = g.n, cnt = P.length / 3;
    for (let i = 0; i < cnt; i++) {
      const x = P[i * 3], y = P[i * 3 + 1], z = P[i * 3 + 2], nx = N[i * 3], ny = N[i * 3 + 1], nz = N[i * 3 + 2];
      const q = [m[0] * x + m[4] * y + m[8] * z + m[12], m[1] * x + m[5] * y + m[9] * z + m[13], m[2] * x + m[6] * y + m[10] * z + m[14]];
      let n = [nm[0] * nx + nm[3] * ny + nm[6] * nz, nm[1] * nx + nm[4] * ny + nm[7] * nz, nm[2] * nx + nm[5] * ny + nm[8] * nz];
      const l = Math.hypot(n[0], n[1], n[2]) || 1; n = [n[0] / l, n[1] / l, n[2] / l];
      g.vert(q, n, c, mt);
    }
    for (let i = 0; i < I.length; i += 3) g.tri(base + I[i], base + I[i + 1], base + I[i + 2]);
    return this;
  }
  /* ---- primitives ---- */
  box(x, y, z, w, h, d, o) {
    const P = [], N = [], I = [], H = [w / 2, h / 2, d / 2];
    for (let a = 0; a < 3; a++) for (let s = -1; s <= 1; s += 2) {
      const u = (a + 1) % 3, v = (a + 2) % 3, base = P.length / 3;
      for (const [su, sv] of [[-1, -1], [1, -1], [1, 1], [-1, 1]]) {
        const p = [0, 0, 0]; p[a] = s * H[a]; p[u] = su * H[u]; p[v] = sv * H[v];
        P.push(p[0] + x, p[1] + y, p[2] + z); const n = [0, 0, 0]; n[a] = s; N.push(n[0], n[1], n[2]);
      }
      I.push(base, base + 1, base + 2, base, base + 2, base + 3);
    }
    return this._emit(P, N, I, o);
  }
  /* general frustum box: bottom w0,d0 -> top w1,d1 (centre x,y,z is the bottom centre) */

function heavy(m, P) {
  const h = m.part('hull'), L = P.L, fw = P.fw, fh = P.fh || fw; const gh = P.gh || fh * .5 + 1.4; h.off = [0, gh, 0];
  { const hh = h; const h2 = m.part('gear', hh, [0, 0, 0]); ((h) => {
  h.col(COL.dkgrey, 1);
  for (const zz of (P.gz || [.22, -.12])) { const isN = zz > .15; if (isN) { h.cyl(0, -(fh * .45 + gh) / 2, L * zz, .1, gh - fh * .4, { ax: 'y', n: 6 }); h.wheel(0, -gh + .5, L * zz, .5, .35); } else h.mir(() => { h.cyl(fw * .45, -(fh * .45 + gh) / 2, L * zz, .14, gh - fh * .4, { ax: 'y', n: 6 }); h.wheel(fw * .45, -gh + .6, L * zz, .6, .45); h.wheel(fw * .45, -gh + .6, L * zz - 1.3, .6, .45); }); }
  })(h2); }
  h.col(P.col, 0);
  const pr = P.prof || [[-.5, .15, .25], [-.44, .6, .65], [-.3, 1, 1], [.2, 1, 1], [.4, .7, .75], [.48, .3, .4], [.5, .05, .08]];
  h.lof(pr.map(s => ({ z: s[0] * L, w: s[1] * fw, h: s[2] * fh, y: 0, n: 2.0 })), { k: 18, cap0: true, cap1: true });
  h.col(COL.glass, 3); h.box(0, fh * .38, L * .4, fw * .6, .35, .9, { c: COL.glass, m: 3 }); h.col(P.col, 0);
  wingPart(h, Object.assign({ y: P.wy !== undefined ? P.wy : -fh * .3, t: P.wt || .4 }, P.wing));
  wingPart(h, Object.assign({ y: P.ty !== undefined ? P.ty : fh * .2, t: .2 }, P.tail));
  finPart(h, Object.assign({ y0: fh * .3, t: .22 }, P.fin));
  // wing engines

function hullShape(m, P) {

  h.col(P.hull || NV.hull, 0); h.lof(secs, { cap0: true, cap1: true });

  h.col(NV.boot, 0); h.box(0, -.05, 0, B * .98, .5, L * .62, {});
  return h;
}
function deckBlk(h, f, y, w, ht, d, c, L) { h.box(0, y + ht / 2, f * L, w, ht, d, { c: c }); }
function mast(h, x, y, z, ht, c) { h.cyl(x, y + ht / 2, z, .12, ht, { ax: 'y', n: 6, c: c || NV.black }); h.box(x, y + ht * .72, z, 1.8, .12, .12, { c: c || NV.black }); h.box(x, y + ht * .9, z, 1.1, .1, .1, { c: c || NV.black }); }
function radar(h, x, y, z, w, c) { h.cyl(x, y, z, .12, .8, { ax: 'y', n: 6, c: NV.black }); h.box(x, y + .55, z, w, w * .5, .15, { c: c || NV.black }); }
function gunTurret(m, parent, name, pivot, o) { // o.L barrel length, o.r, o.tw
  const t = m.part(name, parent, pivot); t.col(o.c || NV.dk, 0); t.cyl(0, o.th * .5, 0, o.tw, o.th, { ax: 'y', n: 10 }); t.box(0, o.th * .6, .2, o.tw * 1.2, o.th * .8, o.tw * 1.2, {});
  const g = m.part(name + 'g', t, [0, o.th * .65, o.tw * .6]); g.col(COL.dkgrey, 1); g.cyl(0, 0, o.L / 2 + .3, o.r, o.L, { n: 8 }); return { t, g };
}
function vlsGrid(m, h, y, zc, cols, rows, cs, L, name) { // hatch parts with anchors
  const k0 = m.vlsN || 0; let k = k0; h.col(COL.dkgrey, 0); h.box(0, y - .02, zc, cols * cs + .3, .06, rows * cs + .3, { c: COL.dkgrey });
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) { const x = (c - (cols - 1) / 2) * cs, z = zc + (r - (rows - 1) / 2) * cs; const hp = m.part('vh' + k, h, [x, y, z - cs * .45]); hp.col(0x3a3f44, 0); hp.box(0, .03, cs * .45, cs * .84, .05, cs * .84, {}); m.anchor('v' + k, h, [x, y, z], [0, 1, 0]); k++; }

function ship(m, P) {

  if (P.ciws) { for (const z of P.ciws) { h.cyl(0, fb + 4, z * L, .6, 1.4, { ax: 'y', n: 10, c: COL.white }); h.sph(0, fb + 5, z * L, .6, { c: COL.white }); m.anchor('c' + (m.nCiws = (m.nCiws || 0) + 1), h, [0, fb + 5, z * L + .8], [0, 0, 1]); } }
  if (P.heli) { h.col(NV.deck, 0); h.cyl(0, fb * 1.03 + .1, P.heli * L, 4.2, .12, { ax: 'y', n: 18, c: 0x5a6065 }); h.cyl(0, fb * 1.03 + .17, P.heli * L, 2.6, .05, { ax: 'y', n: 18, c: COL.yellow }); }

  m.anchor('stern', h, [0, 0, -L * .5], [0, 0, -1]); m.anchor('bow', h, [0, 0, L * .5], [0, 0, 1]); m.shipL = L; m.shipB = B;
  m.fl = { ship: true }; m.waterline = true; m.wake = P.speed || 10;
  m.tick2 = (t) => { if (m.sailing) FX.shipWake(m); };
}
function carrierDeck(m, h, P) {
  const L = P.L, B = P.B, fb = P.fb, cs = P.carrier; const y = fb * 1.03 + .1;
  h.col(0x4a4f55, 0);
  h.ext([[-L * .5, -B * .5 * 1.0], [L * .43, -B * .46], [L * .5, -B * .3], [L * .5, B * .05], [L * .43, B * .5 + cs.over * 1], [-L * .5, B * .5 + cs.over]].map(p => [p[1], p[0]]), .35, { ax: 'y', y0: y });

  // island
  h.col(0x7d868c, 0); h.box(cs.islandX, y + 4.5, cs.islandZ * L, 5.2, 9, 20, { c: 0x7d868c }); h.box(cs.islandX, y + 11, cs.islandZ * L, 3.6, 3, 10, { c: 0x7d868c }); mast(h, cs.islandX, y + 12, cs.islandZ * L, 12); radar(h, cs.islandX, y + 13, cs.islandZ * L + 4, 5);

function sub(m, P) {

  h.col(P.col || 0x2a2f34, 0); h.lof(F.map((f, i) => ({ z: f * L, w: R * 2 * Rf[i] * (P.wf || 1), h: R * 2 * Rf[i], y: 0, n: 2 })), { k: 18, cap0: true, cap1: true });
  h.col(P.red || 0x6a2a24, 0); h.box(0, -R * .6, 0, R * 1.2, .3, L * .6, {});
  // sail
  const s = P.sail; h.col(P.col || 0x2a2f34, 0); h.ext([[s.z - s.l / 2, R * .7], [s.z + s.l / 2, R * .7], [s.z + s.l * .32, R + s.h], [s.z - s.l * .4, R + s.h]], R * (s.w || .6), { ax: 'x', sm: false });
  h.col(COL.black, 0); h.cyl(0, R + s.h + .8, s.z - s.l * .1, .12, 1.6, { ax: 'y', n: 6 }); h.cyl(0, R + s.h + .6, s.z + s.l * .12, .09, 1.2, { ax: 'y', n: 6 }); h.box(0, R + s.h + .2, s.z - s.l * .35, .1, .8, .6, {});
  if (P.sailPlanes) { h.col(P.col || 0x2a2f34, 0); h.mir(() => h.box(R * (s.w || .6) * .5 + 1.4, R + s.h * .45, s.z + s.l * .2, 2.8, .12, 1.4, {})); }
  else h.mir(() => h.box(R * .85, -R * .1, L * .36, 2.6, .12, 1.2, {}));
  // stern planes & rudders
  h.mir(() => h.box(R * .85, 0, -L * .46, R * 1.6, .14, R * .9, {})); h.box(0, R * .85, -L * .46, .14, R * 1.6, R * .9, {}); h.box(0, -R * .85, -L * .46, .14, R * 1.4, R * .9, {});
  h.col(COL.dkgrey, 1); h.cyl(0, 0, -L * .5 + .3, R * .55, .6, { n: 12, r1: R * .35 });
  const pr = m.part('prop', h, [0, 0, -L * .5 - .35]); pr.col(0x8a6a2a, 1); for (let i = 0; i < 5; i++) { pr.push(); pr.ro(0, 0, i * 72); pr.box(0, R * .5, 0, .35, R * .9, .06, { r: [0, 0, 0] }); pr.pop(); } m.spins = [{ part: pr, ax: 2, rate: 160 }]; m.tick2 = t => { for (const q of m.spins) q.part.rot[q.ax] = (t * q.rate * (m.sailing ? 1 : .0)) % 360; m.sailing && m.subWake && m.subWake(); };
  m.sailing = true; m.anchor('tube', h, [0, 0, L * .5 + 1], [0, 0, 1]); m.anchor('stern', h, [0, 0, -L * .5], [0, 0, -1]); m.anchor('bow', h, [0, 0, L * .5], [0, 0, 1]); m.anchor('sailtop', h, [0, R + s.h, s.z], [0, 1, 0]);
  m.isSub = true; m.subMissile = P.missile || null;
}

function propSet(m, h, P, r, blades) { // spinning propeller parts on the wing engines
  const wp = P.wing, list = []; let i = 0;
  for (const ex of (P.engx || [])) for (const sd of [1, -1]) {
    const y = -P.fh * .5 + (P.ey || 0), z = wp.z0 - (P.ez || 1) + (P.el || 3.5) / 2 + .15;
    const p = m.part('prop' + i, h, [ex * sd, y, z]); p.col(COL.black, 0);
    for (let b = 0; b < (blades || 2); b++) { p.push(); p.ro(0, 0, b * 180 / (blades || 2)); p.box(0, 0, 0, .2, r * 2, .06, { c: COL.black }); p.pop(); }
    p.cyl(0, 0, .12, .28, .4, { n: 8, c: COL.dkgrey, r1: .05 });
    list.push({ part: p, ax: 2, rate: 1400 }); i++;
  }
  return list;
}
function acNew(id, name, side, era, spec, P, fx, turbo) {
  reg({ id, name, side, cat: 'Aircraft', era, fx: fx || 'plane', game: P.game || [id], spec, cdist: 2.7, caz: 40, cel: 14,
    build(m) {
      heavy(m, P); const h = m.find('hull'); const spins = [];
      if (turbo) spins.push(...propSet(m, h, P, turbo.r, turbo.n));
      const rd = m.find('rotodome'); if (rd) spins.push({ part: rd, ax: 1, rate: 70 });
      if (spins.length) spinner(m, spins);
      m.anchor('belly', m.root, [0, -(P.fh || 1.5) * .5, 0], [0, 0, 1]);
    } });
}

/* generic gun mount: creates 'gun' (mantlet/trunnion, pitch) and 'barrel' (recoil). returns {gun,barrel}. pivot in turret coords */
function mountGun(m, tur, pivot, o) {
  const gun = m.part('gun', tur, pivot), bar = m.part('barrel', gun, [0, 0, o.recoilZ0 || 0]);
  return { gun, bar };
}

function mbt(m, P) {

  tracks(h, Object.assign({ trackCol: COL.track, hubCol: COL.dkgrey, t: 0.06, ll: 0.18 }, P.tr));
  h.col(C, 0); h.ext(P.hull, P.hw || 2.4, { ax: 'x' });
  if (P.fender !== false) h.mir(() => { h.box(P.tr.x + 0.05, P.fy || 1.05, P.fz || -0.2, 0.8, 0.05, P.fl || 6.2); });
  if (P.skirt) h.mir(() => { for (let i = 0; i < P.skirt.n; i++) h.box(P.tr.x + 0.42, P.skirt.y, P.skirt.z0 + i * P.skirt.dz, 0.06, P.skirt.h, P.skirt.dz - 0.04, { c: D }); });
  hatch(h, 0, P.dy || 1.2, P.dz || 2.6, 0.24, { c: C }); vision(h, 0, (P.dy || 1.2) + 0.05, P.dz || 2.6, 0.2, 3, { w: 0.1 });
  const t = m.part('turret', h, P.tp); t.col(C, 0);
  if (P.tsecs) t.lof(P.tsecs, { k: 20, cap0: true, cap1: true });
  if (P.tpoly) t.ext(P.tpoly, P.tw, Object.assign({ ax: 'x' }, P.text || {}));
  const { gun, bar } = mountGun(m, t, P.gp, {});
  gun.col(C, 0); gun.cyl(0, 0, 0.05, 0.22, 0.3, { ax: 'z', c: D, n: 12 });
  bar.col(COL.dkgrey, 1); barrel(bar, { L: P.L, z0: 0.1, r0: P.r0 || 0.075, r1: P.r1 || 0.065, evac: P.evac, sleeve: P.sleeve, brake: P.brake, sleeveRing: P.ring });

  if (P.detail) P.detail(m, h, t, gun, bar);
  return { h, t, gun, bar };
}

  const st = m.aw('bow'); FX.smoke(V3.add(st.p, [0, 0, 6]), 3, 2, { v: [0, 0, 4], c0: [1, 1, 1], buoy: .5 });

'use strict';
/* ===== rails + rolling trains ===== */
regHidden({ id: '_rails', name: 'rails', build(m) {
  const h = m.part('track'); const N = 720, step = .8, z0 = -150;
  h.col(0x8b7f66, 0); h.box(0, .12, z0 + N * step / 2, 4.4, .24, N * step + 20, { c: 0x8b7f66 });
  h.col(0x4a3a2a, 0); for (let i = 0; i < N; i++) h.box(0, .3, z0 + i * step, 2.9, .14, .24, { c: 0x4a3a2a });
  h.col(0x8a7e74, 1); for (const sx of [-1, 1]) h.box(sx * .72, .45, z0 + N * step / 2, .12, .22, N * step + 20, { c: 0x8a7e74, m: 1 });
} });
const _tr5 = FX.tickRecoil;
FX.tickRecoil = function (m) { _tr5.call(FX, m); if (m.train) FX.stepTrain(m, App.dtLast || .016); };
FX.stepTrain = function (m, dt) {
  const T = m.train; dt = Math.min(dt, .05);
  if (!T.z && T.z !== 0) { T.z = 0; T.v = 0; T.go = false; T.t = 0; }
  const vmax = m.rollSpeed || 12; T.v += ((T.go ? vmax : 0) - T.v) * Math.min(1, dt * (T.go ? .5 : 1.1)); if (!T.go && T.v < .05) T.v = 0;
  T.z += T.v * dt; T.t += dt; if (T.z > 330 && T.go) T.go = false;
  m.fpos = m.fpos || [0, 0, 0]; m.fpos[0] = 0; m.fpos[1] = 3; m.fpos[2] = T.z; m.xf = M4.T(0, 0, T.z);
  for (const a of (m.axles || [])) a.part.rot[0] = ((T.z / a.r) * 57.2958) % 360;
  if (m.rods) { const th = (T.z / 1.0); m.rods.forEach((r, i) => { const ph = th + (i ? Math.PI / 2 : 0); r.part.off = [r.base[0], -r.c * Math.sin(ph), r.c * Math.cos(ph)]; }); }
  m.updateWorld(); T.fx = (T.fx || 0) + dt;
  const rate = T.kind === 'steam' ? Math.max(.07, .5 - T.v * .045) : .09;
  if (T.fx > rate) { T.fx = 0;
    if (T.kind === 'steam') { const c = m.aw('chim'); FX.smoke(c.p, 1.5, 4.5, { v: [FX.rnd(-.4, .4) - 0, 3.2 + T.v * .1, -T.v * .35 + FX.rnd(-.3, .3)], c0: [.95, .95, .96], c1: [.62, .64, .68], grow: 5, buoy: .2, drag: .55, a: .85 }); if (T.v > .5) for (const n of ['cylL', 'cylR']) { const q = m.aw(n); FX.smoke(q.p, .7, 1.4, { v: [(n === 'cylL' ? -1 : 1) * 2.5, .6, -T.v * .4], c0: [1, 1, 1], c1: [.9, .92, .95], grow: 3, buoy: .1, a: .6 }); } }
    else { for (const k of [0, 1]) { const a = m.anchors['stack' + (k ? (-0 + 40 - 21.5) : 40)]; } for (const n in m.anchors) if (n.indexOf('stack') === 0) { const c = m.aw(n); if (T.v > .3) FX.smoke(c.p, 1.1, 3, { v: [0, 2.2, -T.v * .2], c0: [.35, .35, .36], c1: [.6, .6, .62], grow: 4, buoy: .2, a: .6 }); } }
    if (T.v > 2) { const dz = (Math.random() - .5) * 80; FX.smoke([FX.rnd(-3, 3), .3, T.z + dz - m.trainCenter * 0], .9, 1.8, { v: [FX.rnd(-1, 1), .3, 0], c0: [.7, .6, .45], c1: [.7, .62, .5], a: .35, buoy: 0 }); }
  }
  if (T.w) { T.w -= dt; if (T.w > 0 && Math.random() < .8) { const q = m.aw('whistle'); if (q) FX.smoke(q.p, .9, 1.6, { v: [FX.rnd(-.5, .5), 7, FX.rnd(-.5, .5)], c0: [1, 1, 1], c1: [.95, .96, 1], grow: 4, buoy: .3, a: .9 }); } }
};
PROFILES.train = m => { const T = m.train; const L = [{ id: 'roll', label: 'Roll out', run() { if (!T.go) { T.go = true; App.follow = { p: { p: m.fpos || [0, 3, 0] }, until: 1e9, keep: true, off: [0, 2, 0], dist: Math.max(App.R * 1.3, 60) }; m.fpos = m.fpos || [0, 3, 0]; } } }, { id: 'stop', label: 'Brake', run() { T.go = false; } }];
  if (T.kind === 'steam') L.push({ id: 'whistle', label: 'Whistle', run() { T.w = 2.2; App.shake(.15); } }); return L; };
